# ============================================================
# BioLens — fully containerised stack
# ============================================================
# Three services: Neo4j (database) -> backend (FastAPI) -> frontend (Nitro).
# The backend reaches Neo4j over the Compose network as bolt://neo4j:7687,
# so no host.docker.internal and no Neo4j Desktop are required.
#
# Secrets come from ./.env (NEO4J_USER, NEO4J_PASSWORD, NEO4J_DATABASE).
#
# Rollback to the previous Neo4j Desktop architecture:
#   docker compose -f docker-compose.neo4j-desktop.yml up -d
# (the original file is kept unchanged for this purpose)
name: biolens

services:
  neo4j:
    # Enterprise, not Community: the database dump produced by Neo4j Desktop is
    # in Enterprise block format, which the Community image refuses to load.
    # Same edition and version as the Desktop DBMS this data came from.
    image: neo4j:2026.05.0-enterprise
    container_name: biolens-neo4j
    environment:
      # Enterprise image requires an explicit licence acceptance (free for dev).
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # Official image uses NEO4J_AUTH to set the initial password on first start.
      # Do NOT add NEO4J_PASSWORD here: the image turns every NEO4J_* variable
      # into a server setting, so NEO4J_PASSWORD is rejected as unknown setting
      # "PASSWORD". The healthcheck derives both values from NEO4J_AUTH.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in ./.env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - biolens-neo4j-data:/data
      - biolens-neo4j-logs:/logs
      # Staging area for neo4j-admin dump / load (see RUN_BIOLENS.md).
      - ./neo4j/backups:/backups
    # No ports are published: only the backend needs to reach Neo4j, and this
    # avoids any clash with a Neo4j Desktop instance on the Mac.
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'cypher-shell -u "$${NEO4J_AUTH%%/*}" -p "$${NEO4J_AUTH#*/}" "RETURN 1" || exit 1'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  backend:
    build:
      context: ./biolens-backend
      dockerfile: Dockerfile
    container_name: biolens-backend
    environment:
      # Service-name DNS on the Compose network.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in ./.env}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-biolens}
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    # Liveness only: database readiness is GET /health (503 when Neo4j is down),
    # so a stopped database never puts the backend into a restart loop.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: biolens-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  # Named volumes so graph data survives `docker compose down` and reboots.
  biolens-neo4j-data:
  biolens-neo4j-logs:
